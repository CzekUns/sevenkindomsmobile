name: University remaining roof shade analysis
on:
  push:
    branches: [fix/university-roof-complete-color]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - name: Analyze remaining fixed-colored university areas
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/uv.log 2>&1 &
          node tools/analyze-university-roof-remainder.mjs
