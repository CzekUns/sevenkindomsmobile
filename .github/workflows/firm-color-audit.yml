name: Audit building faction colors
on:
  push:
    branches: [fix/firm-faction-colors-grand-market]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - name: Analyze base and MOD firm resources
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          node tools/firm-color-audit.mjs
          node tools/firm-bitmap-stats.mjs
          node tools/firm-color-visual.mjs
