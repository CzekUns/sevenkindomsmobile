name: Produce candidate restored sprites
on:
  push:
    branches: [feature/restore-missing-walk-frames]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install toolkit and Chromium
        run: |
          python -m pip install pillow
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Export true decompressed sprite assets from browser game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/sprite-server.log 2>&1 &
          node tools/export_sprite_sources.mjs
      - name: Produce missing walking poses, updated native SPR and SET files
        run: python tools/restore_walk_frames.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-restored-civilization-sprites
          path: sprite-restoration-output/
          if-no-files-found: warn
