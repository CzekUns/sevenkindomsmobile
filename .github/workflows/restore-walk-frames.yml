name: Produce candidate restored sprites
on:
  push:
    branches: [feature/restore-missing-walk-frames]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image toolkit
        run: python -m pip install pillow
      - name: Produce missing walking poses, updated sprite pack and preview GIFs
        run: python tools/restore_walk_frames.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-restored-civilization-sprites
          path: sprite-restoration-output/
          if-no-files-found: warn
