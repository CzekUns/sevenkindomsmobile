name: Sprite DB structure audit
on:
  push:
    branches: [audit/new-civilizations-sprites]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Analyze packed sprite resources
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          node tools/sprite-audit-probe.mjs
          node tools/sprite-frame-content-audit.mjs
