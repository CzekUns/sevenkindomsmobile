name: University faction roof correction

on:
  push:
    branches: [fix/university-faction-roof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - name: Test pixel-level recolor and real MOD game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/univ-test-http.log 2>&1 &
          node tools/test-university-roof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: university-roof-game-screenshot
          path: university-faction-patch-game.png
          if-no-files-found: ignore
