name: Audit all classic sprites for shadows
on:
  push:
    branches: [feat/ground-shadows-classic-characters]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install pillow
          npm install --no-save playwright
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ground-shadow.log 2>&1 &
          node tools/export_all_ground_units.mjs
          python tools/audit_all_ground_units.py
