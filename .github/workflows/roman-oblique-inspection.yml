name: Roman oblique sprite pixel inspection
on:
  push:
    branches: [art/roman-native-oblique-rigid-legs]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roman-oblique-inspect-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright
      - run: python -m pip install pillow
      - name: Render native source inspection and Roman-only edited candidate
        run: |
          python tools/inspect_roman_native_walk.py
          python tools/build_roman_native_diagonals.py
      - name: Smoke-test native Roman candidate without changing runtime deployment
        run: |
          cp roman-native-output/ROMAN.SPR mod/sprite-restoration-candidate/ROMAN.SPR
          cp roman-native-output/STD.SET mod/god-shadow-candidate/STD.SET
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/roman-native-test.log 2>&1 &
          node tools/test-restored-sprites.mjs
      - name: Preserve offline Roman sprite binaries only in review branch
        run: |
          mkdir -p mod/art-previews/roman-native-obliques/native-candidate
          cp roman-native-output/ROMAN.SPR roman-native-output/STD.SET mod/art-previews/roman-native-obliques/native-candidate/
      - uses: actions/upload-artifact@v4
        with:
          name: native-roman-offline-patch-do-not-merge
          path: roman-native-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-roman-inspection
          path: mod/art-previews/roman-native-obliques
      - name: Save candidate previews to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod/art-previews/roman-native-obliques
          git diff --cached --quiet || git commit -m "art: native Roman walk inspection [skip ci]"
          git push origin HEAD:$GITHUB_REF_NAME
