name: Spawn diagnostics (MOD)

on:
  push:
    branches:
      - fix/spawn-civilta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check MOD runtime and assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('mod/7kaa.wasm').read_bytes()
          print('MOD WASM bytes:',len(b),'sha256:',hashlib.sha256(b).hexdigest())
          print('WASM header:',b[:8].hex())
          print('Original WASM bytes:',Path('7kaa.wasm').stat().st_size)
          for name in ('mod/data/RESOURCE.js','mod/data/SPRITE.js'):
              print(name,Path(name).stat().st_size)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for runtime inspection
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Inspect runtime race list in headless browser
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/spawn-server.log 2>&1 &
          node tools/spawn-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-runtime-screenshots
          path: |
            probe-before.png
            probe-after.png
          if-no-files-found: ignore
