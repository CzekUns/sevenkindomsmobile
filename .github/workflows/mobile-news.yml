name: Mobile news and event alerts

on:
  push:
    branches: [feature/mobile-news-and-production-alerts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Mobile news smoke test on original and MOD WASM
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          node tools/mobile-news.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-news-screenshots
          path: mobile-news-*.png
          if-no-files-found: ignore
