name: Character ground contact shadows
on:
  push:
    branches: [fix/roman-walk-legs-shadow]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contact-shadows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shadows:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install required tools
        run: |
          python -m pip install pillow
          npm install --no-save playwright
      - name: Generate consistent ground-contact shadows for every available added unit action
        run: python tools/enhance_unit_shadows.py
      - name: Verify silhouettes and all palette pixels except new shadow untouched
        run: python tools/test-all-shadows.py
      - uses: actions/upload-artifact@v4
        with:
          name: enhanced-character-shadows
          path: shadow-output/
          if-no-files-found: error
      - name: Stage shadowed native archives and previews, smoke test MOD in real browser
        run: |
          cp shadow-output/*.SPR mod/sprite-restoration-candidate/
          cp shadow-output/STD.SET mod/sprite-restoration-candidate/
          mkdir -p mod/shadow-enhancement-candidate/
          cp shadow-output/REPORT.json mod/shadow-enhancement-candidate/
          cp -r shadow-output/previews mod/shadow-enhancement-candidate/
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/roman-shadows-web.log 2>&1 &
          node tools/test-restored-sprites.mjs
      - name: Persist tested assets in review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod/sprite-restoration-candidate/*.SPR mod/sprite-restoration-candidate/STD.SET mod/shadow-enhancement-candidate
          git diff --cached --quiet || git commit -m "assets: add anchored unit shadows to walking and action frames [skip ci]"
          git push origin HEAD:$GITHUB_REF_NAME
