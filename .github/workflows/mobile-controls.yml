name: Mobile touch controls

on:
  push:
    branches:
      - feature/mobile-joystick-minimap-zoom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test mobile navigation with real WebAssembly
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/sevenkingdoms-http.log 2>&1 &
          node tools/mobile-controls.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screen-captures
          path: mobile-*.png
          if-no-files-found: ignore
