name: Egyptian legs — Roman reference frames
on:
  push:
    branches: [art/roman-egyptian-leg-reference]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: egyptian-leg-atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies
        run: |
          python -m pip install pillow
          npm install --no-save playwright
      - name: Extract authentic Egyptian walk frames and render comparison
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/egypt-preview-server.log 2>&1 &
          node tools/export_egyptian_reference.mjs
          python tools/egyptian_leg_reference.py
          python tools/egyptian_roman_hybrid_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: egyptian-roman-diagonal-reference
          path: mod/art-previews/roman-egyptian/
          if-no-files-found: error
      - name: Save review atlas to branch; no main or game changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod/art-previews/roman-egyptian/
          git diff --cached --quiet || git commit -m "art: authentic Egyptian vs Roman diagonal walk frames [skip ci]"
          git push origin HEAD:$GITHUB_REF_NAME
