<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seven Kingdoms</title>
<style>
  :root{color-scheme:dark;--bg:#0e0c09;--ink:#f0e5c9;--muted:#b4a789;--bronze:#c9a46a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  /* The game draws 800×600; the canvas keeps that ratio and fills the screen. */
  canvas{display:block;width:min(100vw,calc(100vh * 4 / 3));height:min(100vh,calc(100vw * 3 / 4));image-rendering:auto;background:#000;outline:none}
  #loading{position:fixed;inset:0;display:grid;place-content:center;gap:10px;text-align:center;background:var(--bg);z-index:5}
  #loading h1{font:600 26px Georgia,serif;margin:0;letter-spacing:.04em}
  #loading p{margin:0;color:var(--muted)}
  #bar{width:min(320px,80vw);height:6px;border:1px solid var(--bronze);border-radius:4px;overflow:hidden;margin:6px auto 0}
  #bar i{display:block;height:100%;width:0;background:var(--bronze);transition:width .2s}
  #loading button{margin-top:14px;padding:12px 22px;border:1px solid var(--bronze);border-radius:10px;background:#2a241b;color:var(--ink);font:600 16px system-ui,sans-serif}
  #loading[hidden]{display:none}
  #otherVersion{margin-top:6px;color:var(--bronze);font-size:15px}
  #fault{white-space:pre-wrap;color:#e0906c;font-size:12px;max-width:min(560px,90vw);text-align:left}
  /* Phone controls: they sit in the dark bands beside the 4:3 game, above a zoomed canvas. */
  canvas{transform-origin:0 0}
  .pad{position:fixed;z-index:4;display:grid;place-items:center;border:1px solid var(--bronze);background:rgba(20,17,12,.82);color:var(--ink);font:700 15px system-ui,sans-serif;letter-spacing:.06em;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  .pad[hidden]{display:none}
  #modBtn{left:max(14px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%}
  #modBtn.active{background:var(--bronze);color:#1a140c}
  #fsBtn{left:max(14px,env(safe-area-inset-left,0px));top:max(14px,env(safe-area-inset-top,0px));width:48px;height:48px;border-radius:10px}
  #zoomReset{right:max(14px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));width:56px;height:48px;border-radius:10px}
  #fsBtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
</style>
<link rel="stylesheet" href="mobile-controls.css">
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
<button id="modBtn" class="pad" type="button" aria-pressed="false" hidden>MOD</button>
<button id="fsBtn" class="pad" type="button" aria-label="Schermo intero" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
<button id="zoomReset" class="pad" type="button" aria-label="Togli lo zoom" hidden>1×</button>
<div id="loading">
  <h1>Seven Kingdoms</h1>
  <p id="status">Scarico i dati di gioco (circa 115 MB la prima volta)…</p>
  <div id="bar"><i id="barFill"></i></div>
  <button id="start" hidden>Gioca</button>
  <a id="otherVersion" href="mod/">Vai alla versione con le mod</a>
  <pre id="fault"></pre>
</div>
<script>
// Browser build of Seven Kingdoms: Ancient Adversaries (GPL-2.0, 7kfans / Enlight).
// Data packages mount under /data; saves and CONFIG.DAT live in /saves on IndexedDB.
var status = document.getElementById('status'), fill = document.getElementById('barFill'), fault = document.getElementById('fault');
var startBtn = document.getElementById('start'), loading = document.getElementById('loading');
var ready = new Promise(function(resolve){ window.__ready = resolve; });
var Module = {
  canvas: document.getElementById('canvas'),
  noInitialRun: true,
  // The data packages sit in data/; everything else next to the page.
  locateFile: function(path){ return /\.data$/.test(path) ? 'data/' + path : path; },
  preRun: [function(){
    Module.ENV.SKDATA = '/data';
    Module.ENV.SKCONFIG = '/saves';
    Module.FS.mkdir('/saves');
    Module.FS.mount(Module.IDBFS, {}, '/saves');
    Module.addRunDependency('saves');
    Module.FS.syncfs(true, function(err){ if (err) console.error('saves', err); Module.removeRunDependency('saves'); });
  }],
  setStatus: function(text){ if (text) status.textContent = text.replace(/\(\d+\/\d+\)/, '').trim() || status.textContent; },
  monitorRunDependencies: function(left){ if (left === 0) { fill.style.width = '100%'; window.__ready(); } },
  onRuntimeInitialized: function(){},
  print: function(t){ console.log(t); },
  printErr: function(t){ console.warn(t); },
  onAbort: function(what){ fault.textContent = 'Il gioco si è fermato: ' + what; loading.hidden = false; }
};
// Each data package reports its own download progress; the bar sums them.
var progress = {};
Module.setStatus = function(text){
  var m = /Downloading data\.\.\. \((\d+)\/(\d+)\)/.exec(text || '');
  if (m) { progress[text.length % 9] = +m[1] / +m[2]; }
  if (text && !m) status.textContent = text;
};
window.addEventListener('error', function(e){ fault.textContent = 'Errore: ' + (e.message || e); });
// Save files are written to IndexedDB a moment after each change and when the page goes away.
var syncTimer = null;
function persistSaves(){ if (syncTimer) return; syncTimer = setTimeout(function(){ syncTimer = null; Module.FS.syncfs(false, function(err){ if (err) console.error('syncfs', err); }); }, 1500); }
document.addEventListener('visibilitychange', function(){ if (document.hidden && Module.FS) Module.FS.syncfs(false, function(){}); });
window.addEventListener('pagehide', function(){ if (Module.FS) Module.FS.syncfs(false, function(){}); });
// Touch layer: the game only knows a mouse. A finger is the left button, a finger while MOD is held
// the right button (Simone's rule). So a drag is a left-button drag, which draws the selection box,
// and with MOD a right-button drag, which the game turns into scrolling. While the game waits for a
// location (a building to place, an order with a destination) a drag only moves the pointer, so the
// building outline follows the finger, and lifting the finger is the click that places it. Two
// fingers pinch to zoom the picture and move the zoomed view.
// Only touches that start on the canvas count (targetTouches), so the finger holding MOD is never one of them.
// Touches never reach SDL's own handlers.
(function(){
  var c = Module.canvas, press = null, pinch = null, settle = false, MOVE = 12, MAXZOOM = 4;
  var modBtn = document.getElementById('modBtn'), fsBtn = document.getElementById('fsBtn'), zoomReset = document.getElementById('zoomReset');
  var modPointer = null, view = {s: 1, x: 0, y: 0};
  function fire(type, t, button){ c.dispatchEvent(new MouseEvent(type, {bubbles: true, cancelable: true, clientX: t.clientX, clientY: t.clientY, button: button, buttons: type === 'mousedown' ? (button === 2 ? 2 : 1) : (type === 'mousemove' ? button : 0)})); }
  function stop(e){ e.stopImmediatePropagation(); if (e.cancelable) e.preventDefault(); }
  function click(t, button){ fire('mousedown', t, button); setTimeout(function(){ fire('mouseup', t, button); }, 60); }
  function cancelPress(){ if (!press) return; if (press.panning) fire('mouseup', press.t, 2); if (press.boxing) fire('mouseup', press.t, 0); press = null; }
  // The game tells whether it waits for a location on the map (patch 7 in applica-patch.py).
  function waitingForLocation(){ try { return !!(Module._web_waiting_for_location && Module._web_waiting_for_location()); } catch (err) { return false; } }

  //---- zoom: a CSS transform of the canvas; SDL reads the transformed size, so clicks still land right ----//
  function applyView(){
    c.style.transform = view.s === 1 ? '' : 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.s + ')';
    zoomReset.hidden = view.s === 1;
  }
  function resetView(){ view = {s: 1, x: 0, y: 0}; applyView(); }
  function baseBox(){ var r = c.getBoundingClientRect(); return {left: r.left - view.x, top: r.top - view.y, w: r.width / view.s, h: r.height / view.s}; }
  function mid(a, b){ return {x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2}; }
  function dist(a, b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1; }
  function startPinch(a, b){
    var m = mid(a, b), box = baseBox();
    pinch = {d: dist(a, b), s: view.s, box: box, ux: (m.x - box.left - view.x) / view.s, uy: (m.y - box.top - view.y) / view.s};
  }
  function movePinch(a, b){
    var m = mid(a, b), box = pinch.box;
    var s = Math.min(MAXZOOM, Math.max(1, pinch.s * dist(a, b) / pinch.d));
    if (s < 1.03) { resetView(); return; }
    // The picture point that was under the fingers stays under them; the view never leaves the game's own box.
    var x = m.x - box.left - pinch.ux * s, y = m.y - box.top - pinch.uy * s;
    view = {s: s, x: Math.min(0, Math.max(box.w * (1 - s), x)), y: Math.min(0, Math.max(box.h * (1 - s), y))};
    applyView();
  }
  zoomReset.addEventListener('click', resetView);
  window.addEventListener('resize', resetView);

  //---- MOD: held with one thumb, it turns the other finger into the right mouse button ----//
  function setMod(on){ modBtn.classList.toggle('active', on); modBtn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  modBtn.addEventListener('pointerdown', function(e){ if (modPointer !== null) return; modPointer = e.pointerId; try { modBtn.setPointerCapture(e.pointerId); } catch (err) {} setMod(true); e.preventDefault(); });
  function releaseMod(e){ if (modPointer === null || (e.pointerId !== undefined && e.pointerId !== modPointer)) return; modPointer = null; setMod(false); }
  modBtn.addEventListener('pointerup', releaseMod);
  modBtn.addEventListener('pointercancel', releaseMod);
  modBtn.addEventListener('lostpointercapture', releaseMod);
  modBtn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  window.addEventListener('blur', function(){ modPointer = null; setMod(false); });
  function modHeld(){ return modPointer !== null; }

  //---- full screen, turned sideways where the browser allows it ----//
  function canFullscreen(){ return !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen); }
  function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  window.enterFullscreen = function(){
    var el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || isFullscreen()) return;
    try {
      var p = req.call(el, {navigationUI: 'hide'});
      var lock = function(){ if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); };
      if (p && p.then) p.then(lock, function(){}); else lock();
    } catch (err) {}
  };
  fsBtn.addEventListener('click', function(){
    if (isFullscreen()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    else window.enterFullscreen();
  });
  window.showPhoneControls = function(){
    if (!matchMedia('(pointer: coarse)').matches) return;
    modBtn.hidden = false;
    fsBtn.hidden = !canFullscreen();
  };

  //---- the canvas ----//
  c.addEventListener('touchstart', function(e){
    stop(e);
    try { if (Module._web_set_touch_input) Module._web_set_touch_input(1); } catch (err) {}		// no help boxes while playing by touch (patch 8)
    var tt = e.targetTouches;
    if (tt.length >= 2) { cancelPress(); startPinch(tt[0], tt[1]); return; }
    if (tt.length !== 1 || pinch || settle) return;
    // MOD counts if it is held when the finger touches or when it lifts, so letting go of MOD a moment early still gives a right click.
    var t = tt[0]; press = {x: t.clientX, y: t.clientY, t: t, moved: false, mod: modHeld()};
    fire('mousemove', t, 0);
  }, {capture: true, passive: false});
  c.addEventListener('touchmove', function(e){
    stop(e);
    var tt = e.targetTouches;
    if (pinch) { if (tt.length >= 2) movePinch(tt[0], tt[1]); return; }
    if (!press || tt.length !== 1) return;
    var t = tt[0]; press.t = t;
    if (!press.moved && Math.hypot(t.clientX - press.x, t.clientY - press.y) > MOVE) {
      press.moved = true;
      if (press.mod || modHeld()) { press.panning = true; fire('mousedown', {clientX: press.x, clientY: press.y}, 2); }
      else if (waitingForLocation()) press.aiming = true;		// placing a building: the finger only moves the pointer until it lifts
      else { press.boxing = true; fire('mousedown', {clientX: press.x, clientY: press.y}, 0); }	// a left-button drag: the selection box
    }
    fire('mousemove', t, press.panning ? 2 : press.boxing ? 1 : 0);
  }, {capture: true, passive: false});
  function end(e){
    stop(e);
    if (pinch) {
      // After a pinch, wait for every finger to lift before a finger counts again.
      if (e.targetTouches.length < 2) { pinch = null; settle = e.targetTouches.length > 0; }
      return;
    }
    if (settle) { settle = e.targetTouches.length > 0; return; }
    if (!press) return;
    var p = press; press = null;
    if (p.panning) { fire('mouseup', p.t, 2); return; }
    if (p.boxing) { fire('mouseup', p.t, 0); return; }
    click(p.t, (p.mod || modHeld()) ? 2 : 0);		// a tap, or the end of an aiming drag; MOD held: the right button
  }
  c.addEventListener('touchend', end, {capture: true, passive: false});
  c.addEventListener('touchcancel', function(e){ stop(e); cancelPress(); pinch = null; settle = false; }, {capture: true, passive: false});
})();
ready.then(function(){
  status.textContent = matchMedia('(pointer: coarse)').matches ? 'Pronto. Tocco = tasto sinistro; tieni premuto MOD e tocca = tasto destro. Trascina il dito per il riquadro di selezione (più unità insieme); mentre piazzi un edificio il trascinamento lo sposta e si piazza dove alzi il dito; con MOD premuto il trascinamento sposta la visuale. Due dita fanno lo zoom. Gioca va a schermo intero, in orizzontale.' : 'Pronto. Tasto sinistro seleziona, destro ordina; tieni premuto il destro e trascina per spostare la visuale (anche rotella, frecce, bordo dello schermo).';
  startBtn.hidden = false;
  startBtn.onclick = function(){
    loading.hidden = true;
    // On a phone: full screen and sideways (the tap on Gioca lets the page ask for it), then the MOD and full screen buttons.
    if (matchMedia('(pointer: coarse)').matches) window.enterFullscreen();
    window.showPhoneControls();
    Module.canvas.focus();
    // Saves and settings are flushed to IndexedDB every few seconds while playing.
    setInterval(persistSaves, 5000);
    Module.callMain([]);
  };
});
</script>
<script src="mobile-controls.js"></script>
<script src="data/ENCYC.js"></script>
<script src="data/ENCYC2.js"></script>
<script src="data/IMAGE.js"></script>
<script src="data/RESOURCE.js"></script>
<script src="data/SCENARI2.js"></script>
<script src="data/SCENARIO.js"></script>
<script src="data/SOUND.js"></script>
<script src="data/SPRITE.js"></script>
<script src="data/TUTORIAL.js"></script>
<script src="data/MUSIC.js"></script>
<script src="7kaa.js"></script>
</body>
</html>
